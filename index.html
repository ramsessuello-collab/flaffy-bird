<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flaffy Bird</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="score">0</div>
        <!--<div id="fedCount">Fed: 0</div>-->
        <div id="multiplier">x1.0</div>
        <div id="startScreen">
            <h1>Flaffy Bird</h1>
            <p>Press SPACE to Flap</p>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>Game Over</h1>
            <p id="finalScore"></p>
            <p>Press SPACE to Restart</p>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
