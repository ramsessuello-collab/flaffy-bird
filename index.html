<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Flaffy Bird</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="score">0</div>
        <div id="fedCount">Food Eaten: 0</div>
        <div id="multiplier">x1.0</div>
        <div id="startScreen">
            <h1>Flaffy Bird</h1>
            <p style="font-size: 16px; color:#ffe066;">Grow with Junk Food</p>
            <p style="font-size: 16px; color:#ffe066;">Shrink with Healthy Food</p>
            <p>Press Screen or Space to Flap</p>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>Game Over</h1>
            <p id="finalScore"></p>
            <p>Press Screen or Space to Restart</p>
        </div>
    </div>
    <script src="script2.js"></script>

</body>

</html>
